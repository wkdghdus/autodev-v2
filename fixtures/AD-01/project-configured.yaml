schema_version: 2
setup_state: configured
project:
  id: 11111111-1111-1111-1111-111111111111
  slug: autodev-v2
  name: AutoDev v2
sources:
  requirements:
    - milestones/AD-01.md
  context:
    - context/SHARED-INVARIANTS.md
  discovery:
    roots:
      - src
      - tests
  execution_index: .agent/EXECUTION.yaml
execution:
  harness: gajae
  workflow: approved_roadmap_only
  base_policy: dependencies_integrated
  target_ref: refs/heads/main
  max_active_milestones: 1
  max_primary_actions_per_cycle: 1
verification:
  commands:
    - id: unit
      argv:
        - python3
        - -m
        - unittest
      cwd: .
      input_paths:
        - tests
      network_policy: none
      timeout_seconds: 60
      approval_binding: receipt-1
  acceptance_sources:
    - milestones/AD-01.md
  require_independent_review: true
authority:
  requested:
    write-fixture: human
